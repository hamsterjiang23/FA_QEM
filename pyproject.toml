[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fa-qem-bench"
version = "0.1.0"
description = "Auditable six-baseline mesh simplification benchmark"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fast-simplification>=0.1.12,<1",
  "networkx>=3.5,<4",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "psutil>=7,<8",
  "pyyaml>=6,<7",
  "rtree>=1.4,<2",
  "scipy>=1.15,<2",
  "trimesh>=4.8,<5",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
texture = [
  "pygltflib>=1.16,<2",
  "xatlas>=0.0.11,<1",
]

[project.scripts]
fa-qem-bench = "fa_qem_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fa_qem_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
